[package]
name = "persica"
version = "0.13.0"
edition = "2024"
authors = ["Mohammad Taha Heidaryfard"]
description = "The Persica programming language interpreter"
license = "MIT"

[lib]
name = "persica"
path = "src/lib.rs"

[[bin]]
name = "persica"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
